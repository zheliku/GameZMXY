<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243142;
      --sky: #b9e8f4;
      --cream: #fff5d6;
      --orange: #f07b4f;
      --yellow: #f7c95d;
      --teal: #55b9ad;
      --road: #415265;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f5efe3;
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }

    .scene-frame {
      width: min(100vw, 1100px);
      padding: 18px;
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 24px;
      background: var(--sky);
      box-shadow: 10px 12px 0 rgba(36, 49, 66, .14);
    }

    .cloud-drift { animation: drift 22s linear infinite; }
    .cloud-drift.slow { animation-duration: 30s; animation-delay: -10s; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .pedal-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .ride-bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .6s ease-in-out infinite alternate; }
    .wing-flap { transform-box: fill-box; transform-origin: 67% 78%; animation: flap .6s ease-in-out infinite alternate; }
    .leg-pedal { transform-box: fill-box; transform-origin: 52% 18%; animation: leg .6s ease-in-out infinite alternate; }
    .leg-pedal.reverse { animation-delay: -.3s; }
    .feather-float { transform-box: fill-box; transform-origin: center; animation: feather .9s ease-in-out infinite alternate; }
    .feather-float.delay { animation-delay: -.4s; }

    @keyframes drift {
      from { transform: translateX(-180px); }
      to { transform: translateX(1150px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes flap { from { transform: rotate(-5deg); } to { transform: rotate(15deg); } }
    @keyframes leg { from { transform: rotate(-30deg); } to { transform: rotate(35deg); } }
    @keyframes feather { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-6px) rotate(5deg); } }

    @media (prefers-reduced-motion: reduce) {
      .scene * { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="scene-frame">
    <svg class="scene" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车的二维动画</title>
      <desc id="desc">一只戴着黄色头盔的鹈鹕在海边骑着红色自行车，云朵和车轮持续运动。</desc>

      <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a6deef"/>
          <stop offset="1" stop-color="#e0f5ed"/>
        </linearGradient>
        <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4caec3"/>
          <stop offset="1" stop-color="#8bd0cb"/>
        </linearGradient>
        <pattern id="roadDots" width="52" height="18" patternUnits="userSpaceOnUse">
          <circle cx="7" cy="9" r="2" fill="#627488" opacity=".55"/>
          <circle cx="33" cy="4" r="1.5" fill="#627488" opacity=".55"/>
        </pattern>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#26384a" flood-opacity=".2"/>
        </filter>
      </defs>

      <rect width="1100" height="700" fill="url(#skyGradient)"/>

      <g class="cloud-drift" fill="#fffdf4" stroke="#243142" stroke-width="5" stroke-linejoin="round">
        <path d="M-120 145 C-92 113 -44 114 -17 139 C7 91 86 91 106 143 C142 128 180 148 184 181 L-123 181 Z"/>
      </g>
      <g class="cloud-drift slow" fill="#fffdf4" stroke="#243142" stroke-width="5" stroke-linejoin="round">
        <path d="M730 100 C753 72 797 74 815 104 C840 64 901 69 915 111 C951 98 986 119 984 149 L700 149 C700 125 713 107 730 100 Z"/>
      </g>

      <g class="feather-float" fill="#f7c95d" stroke="#243142" stroke-width="4">
        <path d="M184 215 l18 -24 4 31 25 -14 -14 27 30 3 -29 13 17 24 -28 -12 -5 30 -15 -27 -21 17 10 -28 -29 -5 29 -11 z"/>
      </g>
      <g class="feather-float delay" fill="#f07b4f" stroke="#243142" stroke-width="4">
        <path d="M909 216 l13 -20 6 25 23 -5 -16 18 18 16 -24 -3 -5 25 -12 -22 -21 10 13 -21 -19 -15 24 2 z"/>
      </g>

      <path d="M0 350 Q145 318 280 350 T560 346 T840 352 T1100 342 V540 H0 Z" fill="#d9edcf" stroke="#243142" stroke-width="5"/>
      <path d="M0 390 Q150 365 290 395 T560 387 T830 395 T1100 382 V560 H0 Z" fill="url(#waterGradient)" stroke="#243142" stroke-width="5"/>
      <g fill="none" stroke="#d2f4e9" stroke-width="5" stroke-linecap="round" opacity=".7">
        <path d="M80 437 h120 M320 466 h180 M720 429 h145 M915 478 h96"/>
        <path d="M155 500 h95 M540 430 h100 M820 510 h180"/>
      </g>
      <path d="M0 520 H1100 V700 H0 Z" fill="var(--road)" stroke="#243142" stroke-width="5"/>
      <path d="M0 520 H1100 V700 H0 Z" fill="url(#roadDots)" opacity=".7"/>
      <path d="M0 610 H1100" fill="none" stroke="#f7d77c" stroke-width="10" stroke-dasharray="72 38"/>

      <g filter="url(#softShadow)">
        <ellipse cx="560" cy="650" rx="260" ry="20" fill="#202d3c" opacity=".32"/>
      </g>

      <g aria-label="红色自行车">
        <g class="wheel-spin" fill="none" stroke="#243142" stroke-width="8">
          <circle cx="365" cy="585" r="89" fill="#d4f0e8"/>
          <circle cx="755" cy="585" r="89" fill="#d4f0e8"/>
          <g stroke-width="3" opacity=".75">
            <path d="M365 496 V674 M276 585 H454 M302 522 L428 648 M428 522 L302 648"/>
            <path d="M755 496 V674 M666 585 H844 M692 522 L818 648 M818 522 L692 648"/>
          </g>
        </g>
        <path d="M365 585 L478 468 L595 585 L365 585 L478 468 L755 585" fill="none" stroke="#ef6a4d" stroke-width="12" stroke-linejoin="round"/>
        <path d="M478 468 L455 431 M442 431 H488" fill="none" stroke="#243142" stroke-width="10" stroke-linecap="round"/>
        <path d="M595 585 L620 470 M601 468 H642" fill="none" stroke="#243142" stroke-width="9" stroke-linecap="round"/>
        <path d="M755 585 L786 466 M768 466 H808" fill="none" stroke="#243142" stroke-width="8" stroke-linecap="round"/>
        <g class="pedal-spin" fill="none" stroke="#243142" stroke-width="7">
          <circle cx="595" cy="585" r="18" fill="#f7c95d"/>
          <path d="M595 585 L626 607 M595 585 L565 562"/>
          <path d="M622 607 h23 M542 562 h-23" stroke-linecap="round"/>
        </g>
      </g>

      <g class="ride-bob" aria-label="骑车的鹈鹕">
        <path d="M477 485 Q505 451 562 454 Q622 456 656 499 L620 547 Q570 530 515 544 Z" fill="#f6f0dc" stroke="#243142" stroke-width="7"/>
        <path d="M518 504 Q571 481 633 512" fill="none" stroke="#d8c89c" stroke-width="7" stroke-linecap="round"/>

        <g class="wing-flap">
          <path d="M570 471 Q626 414 692 458 Q712 482 674 507 Q632 525 589 500 Z" fill="#e3d5ad" stroke="#243142" stroke-width="7"/>
          <path d="M611 469 Q643 473 679 490 M608 482 Q641 491 666 501" fill="none" stroke="#b9a576" stroke-width="5" stroke-linecap="round"/>
        </g>

        <path d="M552 459 Q538 406 561 355 Q579 319 630 330 Q672 341 675 386 L663 452 Q614 478 552 459 Z" fill="#f6f0dc" stroke="#243142" stroke-width="7"/>
        <path d="M570 366 Q590 337 618 340 Q647 341 659 370" fill="none" stroke="#d8c89c" stroke-width="6" stroke-linecap="round"/>

        <path d="M618 386 Q682 357 749 392 Q779 408 752 432 Q694 443 641 423 Z" fill="#f8aa71" stroke="#243142" stroke-width="7" stroke-linejoin="round"/>
        <path d="M744 394 Q771 399 783 415 Q770 439 748 430" fill="#ee8b5c" stroke="#243142" stroke-width="7"/>
        <circle cx="649" cy="374" r="9" fill="#243142"/>
        <circle cx="652" cy="371" r="3" fill="#fffdf4"/>
        <path d="M612 346 Q634 319 662 341" fill="none" stroke="#f07b4f" stroke-width="7" stroke-linecap="round"/>
        <path d="M600 342 Q627 311 666 333 Q677 340 676 356 Q638 340 606 359 Z" fill="#f7c95d" stroke="#243142" stroke-width="6"/>

        <g class="leg-pedal">
          <path d="M586 520 Q579 549 593 584" fill="none" stroke="#f8aa71" stroke-width="13" stroke-linecap="round"/>
          <path d="M590 580 q16 10 30 1" fill="none" stroke="#f8aa71" stroke-width="11" stroke-linecap="round"/>
        </g>
        <g class="leg-pedal reverse">
          <path d="M625 516 Q648 546 620 582" fill="none" stroke="#f8aa71" stroke-width="13" stroke-linecap="round"/>
          <path d="M620 580 q-15 12 -29 2" fill="none" stroke="#f8aa71" stroke-width="11" stroke-linecap="round"/>
        </g>

        <path d="M531 453 Q493 435 479 405" fill="none" stroke="#f8aa71" stroke-width="14" stroke-linecap="round"/>
        <path d="M478 405 l-28 13 M479 405 l-9 -29" fill="none" stroke="#f8aa71" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g fill="#fffdf4" stroke="#243142" stroke-width="4">
        <path d="M77 587 q16 -27 32 0 q16 -27 32 0 v36 H77 Z"/>
        <path d="M937 576 q15 -25 30 0 q15 -25 30 0 v42 H937 Z"/>
      </g>
      <g fill="#f7c95d" stroke="#243142" stroke-width="4">
        <path d="M112 553 q10 -35 20 0 q12 -27 20 4 q-19 7 -40 -4 Z"/>
        <path d="M1010 552 q10 -35 20 0 q12 -27 20 4 q-19 7 -40 -4 Z"/>
      </g>

      <text x="52" y="79" fill="#243142" font-size="32" font-weight="700" letter-spacing="1">海风骑行日</text>
      <text x="54" y="112" fill="#426376" font-size="17">Pelican on wheels</text>
    </svg>
  </main>
</body>
</html>
